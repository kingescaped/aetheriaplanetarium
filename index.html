<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    
    <!-- Mobile-First Native App Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Nếu dùng 'black-translucent', web sẽ chui xuống dưới tai thỏ. Đổi thành 'black' để iOS tự động đẩy web xuống dưới Status Bar an toàn -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Aetheria Planetarium" />
    <meta name="theme-color" content="#030712" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Aetheria Planetarium</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 overflow-hidden select-none font-sans antialiased overscroll-none touch-none">
    <div id="root">
      <!-- Fallback khởi động tức thì trước khi React mount (Tránh màn hình trắng/nháy) -->
      <div style="position:fixed;inset:0;background:#030712;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div style="width:52px;height:52px;border:2px solid rgba(56,189,248,0.2);border-top:2px solid #38bdf8;border-radius:50%;animation:aetheria-spin 1s linear infinite;"></div>
        <div style="margin-top:18px;font-size:11px;letter-spacing:0.25em;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif;font-weight:600;text-transform:uppercase;">Aetheria Planetarium</div>
      </div>
      <style>@keyframes aetheria-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
