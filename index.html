<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    
    <!-- Mobile-First Native App Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aetheria Planetarium" />
    <meta name="theme-color" content="#030712" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Early iOS Notch & Standalone PWA detection to guarantee zero-delay Safe Area classes -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isIOS = /iphone|ipad|ipod/i.test(ua) || 
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
            (window.navigator && window.navigator.standalone === true);
          if (isIOS) {
            document.documentElement.classList.add('ios-device');
            if (window.screen.height >= 812 || window.screen.width >= 812) {
              document.documentElement.classList.add('ios-notch-device');
            }
            if (isStandalone) {
              document.documentElement.classList.add('ios-standalone');
            }
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Aetheria Planetarium</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 overflow-hidden select-none font-sans antialiased overscroll-none touch-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
